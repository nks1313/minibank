spring.application.name=minibank

# ---- DB: 개발용 H2 메모리 DB (앱을 재시작하면 데이터가 사라짐) ----
spring.datasource.url=jdbc:h2:mem:minibank;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
# 브라우저에서 http://localhost:8080/h2-console 로 DB 내용 확인 가능
spring.h2.console.enabled=true

# ---- JPA ----
# 엔티티 클래스를 보고 테이블을 자동 생성 (개발용. 운영에서는 절대 사용 금지)
spring.jpa.hibernate.ddl-auto=create-drop
# DB 커넥션을 트랜잭션 범위에서만 사용 (권장 설정)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- 로그: 실행되는 SQL과 바인딩 값 출력 ----
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace
